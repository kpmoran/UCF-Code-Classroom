# Production stack for a single Linux host.
#
# Three containers: the app (which also runs the pg-boss worker in-process),
# Postgres, and Caddy terminating TLS. Deployed by .github/workflows/deploy.yml,
# which copies this file and the Caddyfile to the server and runs `up -d`.
#
# Secrets live in `.env` next to this file, on the server, and never travel
# through GitHub. Only the image tag comes from the deploy.

name: uccc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uccc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately no `ports:`. Postgres is reachable only on the compose network,
    # so it is not exposed to the internet even if the host firewall is wrong.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    # Pinned by the deploy to a commit sha, so what is running is always traceable
    # to a commit and a rollback is a tag change rather than a rebuild.
    image: ghcr.io/kpmoran/ucf-code-classroom:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Auth.js builds OAuth callback URLs from the request's own origin, and Next.js
      # in standalone mode reports its bind address — HOSTNAME=0.0.0.0, set in the
      # Dockerfile so it listens on all interfaces — rather than the public host. So
      # without this, every redirect_uri is https://0.0.0.0:3000/... and GitHub
      # rejects the sign-in. `trustHost` does not help: redirect_uri comes from the
      # request URL, not from the Host header.
      #
      # Derived from APP_URL rather than set separately, so the canonical origin has
      # exactly one definition and the two cannot drift apart.
      AUTH_URL: ${APP_URL:?set APP_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    # No host port either: Caddy reaches it over the compose network. Publishing
    # 3000 would expose the app on plain HTTP alongside the TLS it is meant to be
    # behind.
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Nightly pg_dump, verified and pruned. Same image as the server, because pg_dump
  # refuses to dump a server newer than itself — pinning both to one tag removes a
  # failure that would otherwise only appear after a Postgres upgrade.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uccc}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/restore.sh:/restore.sh:ro
      # A host directory, not a named volume, so copying dumps off the machine is
      # just scp against a path you can see. Which is the point — a backup that
      # only exists on the disk it is protecting is half a backup.
      - ./backups:/backups
    # Split deliberately: with the script in `entrypoint`, a
    # `docker compose run backup /restore.sh` appends "/restore.sh" as an argument to
    # the backup loop instead of replacing it — the restore silently becomes a
    # sleeping backup daemon, which is how the first attempt hung for ten minutes.
    # Putting the loop in `command` makes it replaceable, which the restore relies on.
    entrypoint: ['/bin/sh']
    command: ['/backup.sh']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      # Caddy requests a certificate for exactly this name, so it has to match DNS.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      # An old hostname to keep redirecting after a rename. Required by the
      # Caddyfile's host matcher; see the comment there if you have none.
      LEGACY_DOMAIN: ${LEGACY_DOMAIN:?set LEGACY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Losing this volume means re-issuing, which
      # Let's Encrypt rate-limits, so it is a named volume rather than a temp dir.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
