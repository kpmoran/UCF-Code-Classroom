name: CI

# Everything here runs without credentials and without a database, so it also
# works on pull requests from forks — where secrets are deliberately withheld.
# The suites that need a real GitHub organization live in verify.yml.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholders, not secrets. src/lib/env.ts validates the environment at import
  # time and throws on anything missing, so these have to be present and
  # well-formed even though nothing here connects anywhere. Verified by running
  # the whole job locally against an unroutable DATABASE_URL: no step opens a
  # database connection or calls GitHub.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/uccc?schema=public
  APP_URL: http://localhost:3000
  AUTH_SECRET: ci-placeholder-not-a-secret
  # 32 zero bytes, base64. ENCRYPTION_KEY is length-checked, so an arbitrary
  # string will not do.
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  RUN_WORKER: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, which reads DATABASE_URL from
      # prisma.config.ts. It does not connect — but the variable must exist, which
      # is why the env block above is job-wide rather than per-step.
      - run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      # Cheapest signals first, so an obvious mistake fails in under a minute.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
